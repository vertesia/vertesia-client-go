name: Release
run-name: ${{ inputs.request_id || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: vX.Y.Z or vX.Y.Z-dev.YYYYMMDD.HHMMSSZ
        required: true
        type: string
      source_sha:
        description: Optional immutable synchronized source commit
        type: string
        default: ""
      request_id:
        description: Optional caller correlation ID
        type: string
        default: ""
      dry_run:
        description: Validate, test and build without creating tags or publishing
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub release as a prerelease; dev versions always are
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  MARK_PRERELEASE: ${{ inputs.prerelease }}
  VERTESIA_LIVE_TESTS: "0"

jobs:
  release:
    name: Release SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create or verify the immutable source tag and GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test release contract
        run: python3 -m unittest discover -s scripts -p test_release_cohort.py
      - name: Validate cohort
        run: python3 scripts/release_cohort.py validate --lang go
      - name: Test SDK
        run: |
          go test ./...
          go vet ./...
      - name: Create immutable source tag
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_cohort.py tag --lang go
      - name: Create or resume GitHub release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_cohort.py release --lang go
